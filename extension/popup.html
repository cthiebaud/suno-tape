<!doctype html>
<style>
  body { font: 13px -apple-system, sans-serif; width: 240px; padding: 10px; }
  button { width: 100%; padding: 8px; font-size: 13px; margin-bottom: 6px; }
  button.stop { background: #d33; color: white; border: none; border-radius: 4px; }
  button:disabled { opacity: 0.5; }
  .shortcut { color: #888; font-weight: normal; }
  #status { margin-top: 8px; color: #555; white-space: pre-wrap; }
</style>
<button id="start">Start recording</button>
<button id="stop" class="stop">Stop recording</button>
<div id="status"></div>
<script src="popup.js"></script>
