[project]
name = "suno-tape"
version = "0.1.0"
description = "Record a Suno share page's authorized playback via an OS audio loopback -- like dubbing a broadcast to tape."
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40",
]

[project.scripts]
suno-tape = "suno_tape.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
